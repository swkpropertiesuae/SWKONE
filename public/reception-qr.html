<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1a33" />
  <title>SWK ONE — Office Attendance Sign-In</title>
  <style>
    :root {
      --bg: #0b1a33;
      --card: #0d1f3c;
      --gold: #B68F70;
      --gold-light: #E0C1A3;
      --bronze-deep: #6F513B;
      --ivory: #F3EFE6;
      --emerald: #34d399;
      --text: #F3EFE6;
      --muted: #b8afa3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #14305c 0%, var(--bg) 68%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 410px;
      background: linear-gradient(165deg, rgba(11, 26, 51, 0.96) 0%, rgba(8, 20, 42, 0.98) 100%);
      border: 1px solid rgba(224, 193, 163, 0.35);
      border-radius: 24px;
      padding: 26px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }
    .brand-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .brand-logos img.lockup { height: 54px; width: auto; object-fit: contain; }
    .brand-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-light);
      border: 1px solid rgba(224, 193, 163, 0.3);
      background: rgba(224, 193, 163, 0.08);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    h1 { font-size: 20px; font-weight: 700; color: var(--ivory); }
    .wifi-pill {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 12px;
      margin-bottom: 16px;
      background: rgba(6, 78, 59, 0.55);
      border: 1px solid rgba(224, 193, 163, 0.35);
      color: var(--gold-light);
    }
    .wifi-pill.err {
      background: rgba(136, 19, 55, 0.6);
      border-color: rgba(244, 63, 94, 0.5);
      color: #fecdd3;
    }
    .error-box {
      display: none;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(136, 19, 55, 0.7);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fecdd3;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid rgba(224, 193, 163, 0.25);
      color: var(--ivory);
      font-size: 14px;
      outline: none;
    }
    .field input:focus { border-color: var(--gold-light); }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 0;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
      color: var(--bg);
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .checkin-box {
      display: none;
      text-align: center;
      padding: 8px 0;
    }
    .check-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(224, 193, 163, 0.16);
      border: 2px solid var(--gold-light);
      color: var(--gold-light);
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .meta-table {
      margin-top: 16px;
      background: rgba(8, 20, 42, 0.92);
      border: 1px solid rgba(224, 193, 163, 0.24);
      border-radius: 16px;
      padding: 14px;
      font-size: 12px;
      text-align: left;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
    }
    .meta-row span:first-child { color: var(--muted); }
    .meta-row span:last-child { font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logos">
        <img src="/brand/one/horizontal-lockup.png" alt="SWK ONE" class="lockup" />
      </div>
      <span class="brand-badge">SWK ONE · Reception Terminal</span>
      <h1 id="pageTitle">Office Attendance Sign-In</h1>
    </div>

    <div id="signInSection">
      <div id="wifiStatus" class="wifi-pill">
        Connected to <b>SWK-Properties-Office</b> (Approved Network)
      </div>
      <div id="errorBox" class="error-box"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" required autocomplete="username" placeholder="name@swk.property" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button id="submitBtn" type="submit" class="btn">Sign In &amp; Check In</button>
      </form>
    </div>

    <div id="checkInSection" class="checkin-box">
      <div class="check-circle">✓</div>
      <div style="font-size: 18px; font-weight: 700; color: #E0C1A3; margin-bottom: 4px;">Checked In Successfully</div>
      <div id="empName" style="font-size: 14px; font-weight: 600; color: #F3EFE6;"></div>
      <div class="meta-table">
        <div class="meta-row"><span>Check-In Time (GST)</span><span id="metaTime"></span></div>
        <div class="meta-row"><span>Status</span><span id="metaStatus" style="color: #6ee7b7;">On Time ✓</span></div>
        <div class="meta-row"><span>Network</span><span id="metaNet" style="color: #6ee7b7;">Office Wi-Fi Verified</span></div>
        <div class="meta-row"><span>Reference</span><span id="metaRef" style="color: #E0C1A3;"></span></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      var rawType = String((conn && (conn.type || conn.effectiveType)) || 'wifi').toLowerCase();
      var isCellular = rawType.indexOf('cellular') !== -1 || rawType === '3g' || rawType === '2g';
      var wifiEl = document.getElementById('wifiStatus');
      var submitBtn = document.getElementById('submitBtn');

      if (isCellular) {
        wifiEl.className = 'wifi-pill err';
        wifiEl.innerHTML = 'Not on Office Wi-Fi. Connect to <b>SWK-Properties-Office</b> to check in.';
        submitBtn.disabled = true;
      }

      fetch('/api/public/reception-qr/wifi-config')
        .then(function (r) { return r.json(); })
        .then(function (cfg) {
          if (cfg && cfg.strict_ip && cfg.ip_matches_office === false) {
            wifiEl.className = 'wifi-pill err';
            wifiEl.innerHTML = 'Not on Office Wi-Fi (' + (cfg.ssid || 'SWK-Properties-Office') + '). Connect to approved office network.';
            submitBtn.disabled = true;
          } else if (cfg && cfg.ssid && !isCellular) {
            wifiEl.innerHTML = 'Connected to <b>' + cfg.ssid + '</b>';
          }
        })
        .catch(function () {});

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var errBox = document.getElementById('errorBox');
        errBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Checking In…';

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        fetch('/api/public/reception-qr/scan-login-checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            password: password,
            require_login: true,
            strict_anti_loophole: true,
            qr_code_or_token: 'SWK-RECEPTION-STAND-DXB-1',
            network_ssid: 'SWK-Properties-Office',
            connection_type: isCellular ? 'cellular' : 'wifi',
            camera_verified: true
          })
        })
          .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
          .then(function (res) {
            if (res.status >= 400 || res.body.error) {
              throw new Error(res.body.error || 'Sign-in or network verification failed.');
            }
            var data = res.body;
            document.getElementById('pageTitle').textContent = 'Attendance Confirmed';
            document.getElementById('signInSection').style.display = 'none';
            document.getElementById('checkInSection').style.display = 'block';
            document.getElementById('empName').textContent = (data.employee && data.employee.name) || email;
            document.getElementById('metaTime').textContent = String((data.attendance_event && data.attendance_event.check_in_at) || new Date().toISOString()).slice(0, 16).replace('T', ' ');
            var isLate = data.verification_summary && data.verification_summary.is_late;
            document.getElementById('metaStatus').textContent = isLate ? ('Late (+' + data.verification_summary.late_minutes + ' min)') : 'On Time ✓';
            document.getElementById('metaRef').textContent = (data.attendance_event && data.attendance_event.event_no) || 'VERIFIED';
          })
          .catch(function (err) {
            errBox.textContent = err.message || 'Check-in failed.';
            errBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In & Check In';
          });
      });
    })();
  </script>
</body>
</html>
