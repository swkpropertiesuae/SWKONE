<html lang="en">
<head>

<meta name="theme-color" content="#0b1a33">
<title>You are offline – SWK ONE</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1a33; color: #F3EFE6; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 440px; text-align: center; background: #0d1f3c; border: 1px solid rgba(224, 193, 163, 0.28); border-radius: 24px; padding: 32px 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4); }
  h1 { font-size: 22px; margin: 20px 0 8px; color: #E0C1A3; }
  p { margin: 0 0 22px; color: #d8cfc3; font-size: 14px; }
  a { display: inline-block; background: linear-gradient(135deg, #E0C1A3 0%, #B68F70 100%); color: #0b1a33; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 12px; }
  a:focus-visible { outline: 3px solid #E0C1A3; outline-offset: 3px; }
  @media (prefers-color-scheme: light) {
    body { background: #F3EFE6; color: #0b1a33; }
    main { background: #ffffff; border-color: rgba(182, 143, 112, 0.35); box-shadow: 0 20px 45px rgba(8, 20, 42, 0.12); }
    h1 { color: #0b1a33; }
    p { color: #6F513B; }
